name: policy-crawler

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env to the pooled Neon connection string}
      HOST: 0.0.0.0
      PORT: 8000
      CORS_ALLOW_ORIGINS: http://127.0.0.1:3000,http://localhost:3000
      CRAWL4_AI_BASE_DIRECTORY: /app/.runtime
      PLAYWRIGHT_BROWSERS_PATH: /opt/ms-playwright
    ports:
      - "8000:8000"
    volumes:
      - crawler-runtime:/app/.runtime
    init: true
    shm_size: 1gb

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:8000}
        NEXT_PUBLIC_AMAP_KEY: ${NEXT_PUBLIC_AMAP_KEY:-}
        NEXT_PUBLIC_AMAP_SECURITY_JS_CODE: ${NEXT_PUBLIC_AMAP_SECURITY_JS_CODE:-}
    depends_on:
      - api
    environment:
      INTERNAL_API_URL: http://api:8000
    ports:
      - "3000:3000"

volumes:
  crawler-runtime:
