name: policy-crawler

services:
  postgres:
    image: postgis/postgis:16-3.5
    # The upstream image is amd64-only; Docker Desktop emulates it on Apple Silicon.
    platform: linux/amd64
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-policy_crawler}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace_with_local_password}
      POSTGRES_DB: ${POSTGRES_DB:-policy_crawler}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./sql/001_data_warehouse_layers.sql:/docker-entrypoint-initdb.d/001_data_warehouse_layers.sql:ro

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-policy_crawler}:${POSTGRES_PASSWORD:-replace_with_local_password}@postgres:5432/${POSTGRES_DB:-policy_crawler}
      HOST: 0.0.0.0
      PORT: 8000
      CORS_ALLOW_ORIGINS: http://127.0.0.1:3000,http://localhost:3000
      CRAWL4_AI_BASE_DIRECTORY: /app/.runtime
      PLAYWRIGHT_BROWSERS_PATH: /opt/ms-playwright
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./output:/app/output
      - crawler-runtime:/app/.runtime
    init: true
    shm_size: 1gb

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://127.0.0.1:8000}
        NEXT_PUBLIC_AMAP_KEY: ${NEXT_PUBLIC_AMAP_KEY:-}
        NEXT_PUBLIC_AMAP_SECURITY_JS_CODE: ${NEXT_PUBLIC_AMAP_SECURITY_JS_CODE:-}
    depends_on:
      - api
    environment:
      INTERNAL_API_URL: http://api:8000
    ports:
      - "3000:3000"

volumes:
  postgres-data:
  crawler-runtime:
